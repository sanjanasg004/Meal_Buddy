{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MealBuddy - Add Delivery Partner</title>

    <link
        rel="stylesheet"
        href="{% static 'delivery/delivery_partner.css' %}"
    >

</head>

<body>

<div class="partner-page">

    <div class="partner-card">

        <!-- HEADER -->

        <div class="partner-header">

            <div class="partner-icon">
                🛵
            </div>

            <h1>Add Delivery Partner</h1>

            <p>
                Add a delivery partner to MealBuddy 🚀
            </p>

        </div>


        <!-- FORM -->

        <form
            method="POST"
            action="{% url 'add_delivery_partner' %}"
        >

            {% csrf_token %}


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Partner Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="e.g. Rahul Kumar"
                    required
                >

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    name="mobile"
                    maxlength="10"
                    placeholder="9876543210"
                    required
                >

            </div>


            <!-- VEHICLE -->

            <div class="form-group">

                <label>
                    Vehicle Type
                </label>

                <select
                    name="vehicle_type"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Select vehicle
                    </option>

                    <option value="Bike">
                        🏍️ Bike
                    </option>

                    <option value="Scooter">
                        🛵 Scooter
                    </option>

                    <option value="Car">
                        🚗 Car
                    </option>

                    <option value="Bicycle">
                        🚲 Bicycle
                    </option>

                </select>

            </div>


            <!-- LICENSE -->

            <div class="form-group">

                <label>
                    License Number
                </label>

                <input
                    type="text"
                    name="license_number"
                    placeholder="KA01AB1234"
                    required
                >

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label>
                    Status
                </label>

                <select
                    name="status"
                    required
                >

                    <option value="Available">
                        🟢 Available
                    </option>

                    <option value="Busy">
                        🟠 Busy
                    </option>

                    <option value="Offline">
                        ⚫ Offline
                    </option>

                </select>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="primary-btn"
            >
                ➕ Add Delivery Partner
            </button>

        </form>


        <a
            href="{% url 'show_delivery_partners' %}"
            class="secondary-link"
        >
            👀 View Delivery Partners
        </a>

    </div>

</div>

</body>

</html>

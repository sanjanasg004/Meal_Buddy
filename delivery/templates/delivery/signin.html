{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealBuddy - Sign In</title>


<link rel="stylesheet" href="{% static 'delivery/signin.css' %}">


</head>

<body>


<div class="container">

    <div class="logo">🍴</div>

    <h2>Welcome Back! 💜</h2>
    <p class="subtitle">Sign in to continue to MealBuddy</p>

    <form action="{% url 'signin' %}" method="post">
        {% csrf_token %}

        <label>Username</label>
        <input 
            type="text" 
            name="username" 
            placeholder="Enter your username"
            required
        >

        <label>Password</label>
        <input 
            type="password" 
            name="password" 
            placeholder="Enter your password"
            required
        >

        <button type="submit">SIGN IN ✨</button>

    </form>

    <p class="bottom-text">
        Don't have an account?
        <a href="{% url 'open_signup' %}">Sign Up</a>
    </p>

</div>


</body>
</html>

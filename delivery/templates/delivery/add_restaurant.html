{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>MealBuddy - New Restaurant</title>

<link rel="stylesheet" href="{% static 'delivery/add_restaurant.css' %}">


</head>

<body>


<div class="restaurant-card">

    <div class="restaurant-icon">🍽️</div>

    <h1>Add New Restaurant</h1>

    <p class="subtitle">
        Add a new restaurant to your MealBuddy collection
    </p>

    <form action="{% url 'add_restaurant' %}" method="post">

        {% csrf_token %}

        <label>Restaurant Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter restaurant name"
            required
        >

        <label>Picture URL</label>
        <input
            type="text"
            name="picture"
            placeholder="Paste restaurant image URL"
        >

        <label>Cuisine</label>
        <input
            type="text"
            name="cuisine"
            placeholder="e.g. Indian, Chinese, Italian"
            required
        >

        <label>Rating</label>
        <input
            type="number"
            name="rating"
            min="0"
            max="5"
            step="0.5"
            placeholder="0 - 5"
            required
        >

        <button type="submit">
            ADD RESTAURANT 🍽️
        </button>

    </form>

</div>

</body>
</html>

{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>MealBuddy - Update Restaurant</title>

<link rel="stylesheet" href="{% static 'delivery/update_restaurant.css' %}">


</head>

<body>


<div class="update-card">

    <div class="restaurant-icon">
        🍽️
    </div>

    <h1>Update Restaurant</h1>

    <p class="subtitle">
        Update the restaurant information below ✨
    </p>

    <form action="{% url 'update_restaurant' restaurant.id %}" method="post">

        {% csrf_token %}

        <label>Restaurant Name</label>

        <input
            type="text"
            name="name"
            value="{{ restaurant.name }}"
            placeholder="Restaurant name"
            required
        >


        <label>Picture URL</label>

        <input
            type="url"
            name="picture"
            value="{{ restaurant.picture }}"
            placeholder="Paste image URL"
        >


        <label>Cuisine</label>

        <input
            type="text"
            name="cuisine"
            value="{{ restaurant.cuisine }}"
            placeholder="e.g. Indian, Chinese, Italian"
            required
        >


        <label>Rating</label>

        <input
            type="number"
            name="rating"
            min="0"
            max="5"
            step="0.5"
            value="{{ restaurant.rating }}"
            placeholder="0 - 5"
            required
        >


        <button type="submit">
            UPDATE RESTAURANT ✨
        </button>

    </form>


    <a href="{% url 'open_show_restaurant' %}" class="back-link">
        ← Back to Restaurants
    </a>

</div>


</body>
</html>

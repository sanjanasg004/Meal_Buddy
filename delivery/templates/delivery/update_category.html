<!DOCTYPE html>
<html>
<head>
    <title>Update Category</title>
</head>

<body>

    <h1>Update Category</h1>

    <form method="POST"
          action="{% url 'update_category' category.id %}">

        {% csrf_token %}

        <label>Category Name</label>

        <input
            type="text"
            name="name"
            value="{{ category.name }}"
            required
        >

        <br><br>

        <label>Image URL</label>

        <input
            type="url"
            name="image"
            value="{{ category.image }}"
        >

        <br><br>

        <label>Description</label>

        <textarea name="description">{{ category.description }}</textarea>

        <br><br>

        <label>
            <input
                type="checkbox"
                name="is_active"
                {% if category.is_active %}checked{% endif %}
            >

            Active
        </label>

        <br><br>

        <button type="submit">
            Update Category
        </button>

    </form>

</body>
</html>
